<svg width="900" height="640" viewBox="0 0 900 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stilisierte Karte der Region Hannover</title>
  <desc id="desc">Stilisierte Regionskarte mit Ortsnamen aus Hannover und Umland.</desc>
  <defs>
    <linearGradient id="regionFill" x1="120" y1="40" x2="780" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EB3347"/>
      <stop offset="1" stop-color="#AF0F1F"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="900" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8D0E1A" flood-opacity="0.18"/>
    </filter>
    <style>
      .tile{fill:url(#regionFill);stroke:#fff;stroke-width:3;rx:24;ry:24}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .small{font-size:16px}
      .tiny{font-size:15px}
      .tiny2{font-size:14px}
      .city{font-size:20px;font-weight:800}
    </style>
  </defs>
  <g filter="url(#shadow)">
